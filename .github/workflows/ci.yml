name: IRIS CI Pipeline

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

    
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/58620345939/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-actions@project-32301d32-7dfb-43f1-b1a.iam.gserviceaccount.com

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull DVC Data
        run: |
          dvc pull --force

      - name: Install CML
        run: |
          npm install -g @dvcorg/cml

      - name: Verify Installation
        run: |
          python --version
          pip --version
          pytest --version

      - name: Run Data & Model Tests
        run: |
          pytest -v | tee report.txt

      - name: Generate Test Report
        run: |
          echo "# CI Test Report" > report.md
          echo "" >> report.md
          echo "## Pytest Output" >> report.md
          echo '```' >> report.md
          cat report.txt >> report.md
          echo '```' >> report.md

      - name: Install CML
        run: |
          npm install -g @dvcorg/cml

      - name: Comment on Pull Request
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md
