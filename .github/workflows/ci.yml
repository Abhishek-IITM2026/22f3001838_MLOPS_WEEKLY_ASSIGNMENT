name: IRIS CI Pipeline

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  PROJECT_ID: project-32301d32-7dfb-43f1-b1a
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: iris-repo
  IMAGE_NAME: iris-api
  CLUSTER_NAME: iris-cluster
  CLUSTER_LOCATION: us-central1-a







jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: file:./mlruns

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencion
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/58620345939/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@project-32301d32-7dfb-43f1-b1a.iam.gserviceaccount.com

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull DVC Data
        run: |
          dvc pull --force

      - name: Reset MLflow Tracking
        run: |
          rm -rf mlruns
          rm -f mlflow.db

      - name: Verify Installation
        run: |
          python --version
          pip --version
          mlflow --version
          pytest --version

      - name: Train and Register MLflow Model
        run: |
          python train.py

      - name: Run Data & Model Tests
        run: |
          pytest -v | tee report.txt

      - name: Generate Test Report
        run: |
          echo "# CI Test Report" > report.md
          echo "" >> report.md
          echo "## Pytest Output" >> report.md
          echo '```' >> report.md
          cat report.txt >> report.md
          echo '```' >> report.md

      - name: Install CML
        run: |
          npm install -g @dvcorg/cml

      - name: Comment on Pull Request
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md

            - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push \
            us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}

      - name: Update Kubernetes Deployment
        run: |
          kubectl set image deployment/iris-api \
          iris-api=us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/iris-api
